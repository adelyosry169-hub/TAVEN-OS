# ============================================================
# ده مش ملف بيترفع على GitHub! انسخ المحتوى ده وحطه في:
# Streamlit Cloud -> Manage app -> Settings -> Secrets
# ============================================================

# بيانات تسجيل الدخول (الشركاء التلاتة + حساب عام)
[credentials]
adel = "adel1"
taven = "taven1"
ahmedy = "1234"
ahmeds = "1234"

# آي دي ملف TAVEN.xlsx على جوجل درايف (من رابط الملف)
# مؤقتًا سيبه فاضي لحد ما تعمل خطوات جوجل درايف اللي هقولك عليها
drive_file_id = ""

# بيانات حساب الخدمة (Service Account) بتاع جوجل درايف
# هتنزل ملف JSON من Google Cloud Console وتنسخ كل قيمة هنا
[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = ""
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
